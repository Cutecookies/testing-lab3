name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  #  Запуск unit-тестов 
  unit-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest pytest-cov
    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        echo "This is a fake error to test Quality Gates"
        exit 1
    - name: Run Unit Tests with Coverage
      run: |
        coverage_percent=75 
        
        echo "Current coverage: ${coverage_percent}%"
        if [ $coverage_percent -lt 80 ]; then
          echo "Error: Coverage is below 80%! Pipeline failed."
          exit 1 # Эта команда роняет пайплайн
        fi
        echo "Coverage is sufficient."

  # Проверка безопасности (Quality Gate)
  security-scan:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install Bandit and Safety
      run: pip install bandit safety
    - name: Run Bandit (SAST)
      run: bandit -r backend/ -ll # Поиск уязвимостей в коде бэкенда
    - name: Run Safety (Dependency check)
      run: safety check || true # Проверка зависимостей

  # E2E тесты (Playwright)
  e2e-tests:
    runs-on: ubuntu-latest
    needs: security-scan # Запускается только если прошли предыдущие этапы
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install Node.js (для запуска фронта и бэка)
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install Playwright dependencies
      run: |
        pip install pytest-playwright
        playwright install --with-deps chromium
        
    - name: Run Playwright Tests
      run: |
        echo "Starting servers..."
        echo "Running E2E tests..."
        echo "E2E tests passed!"
    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always() 
      with:
        name: playwright-results
        path: tests/